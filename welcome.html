<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
        <section class="Welcome">

        <div class="left">
              <img src="./images/Mask group.png" alt="">
        </div>

        <div class="right">

              <div class="Welcome-Back">
                <img src="./images/Logo (2).png" alt="logo">
                <p>Welcome Back</p>
                <span>Sign in to your account to continue your journey</span>
              </div>

               <div class="information">

                <div class="inset">
                  <label for="email">Email Address</label>
                  <input type="email" placeholder="arwa@gmail.com">
                </div>

                 <div class="inset">
                  <label for="password">Password</label>
                  <input type="password" placeholder="******">
                </div>
                 
                <div class="Remember">
                    
                  <div class="checkbox">
                  <input type="checkbox">
                  <label for="checkbox">Remember me</label>
                  </div>

                  <a href="./Reset Password.html">Forgot password?</a>
                </div>
               
                <!-- <div class="login">Login</div> --> 
                 <div class="login">
                    <a href="./Password.html" >Reset Password</a>
                </div>

                <span>Or continue with</span>

                <div class="app">

                 <div class="google">
                  <img src="./images/Icon (18).png" alt="icon">
                  <a href="https://www.google.com/" target="_blank">Google</a>
                 </div>

                 <div class="apple">
                  <img src="./images/mdi_apple.png" alt="icon">
                  <a href="https://www.Apple.com/" target="_blank">Apple</a>
                
                 </div>
                </div>

                <div class="account">
                  <p>Don't have an account? </p>
                   <a href="./create.html">Create account</a>
                </div>

               </div>
        </div>

     </section>
</body>
</html>
